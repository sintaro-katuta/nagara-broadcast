name: Set up first administrator
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Account setup code from the signed-in account'
        required: true
        type: string
      confirmation:
        description: 'Type SET FIRST ADMIN'
        required: true
        type: string
permissions:
  contents: read
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'SET FIRST ADMIN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-production-d1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      - name: Provision first administrator
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_SETUP_CODE: ${{ inputs.code }}
        run: node scripts/bootstrap-first-admin.mjs
