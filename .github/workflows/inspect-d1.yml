name: Inspect D1 schema
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/verify/d1-restore-isolated'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build staging assets
        run: npm run build && node scripts/build-cloudflare.mjs
      - name: Prepare isolated staging configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-stage-diagnostic.mjs
      - name: Deploy staging diagnostics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.168.0 deploy --config /tmp/nagara-auth-staging.json
      - name: Check staging email connection without sending a message
        env:
          NAGARA_STAGE_GATE: ${{ secrets.NAGARA_STAGE_GATE }}
        run: node scripts/test-stage-diagnostic.mjs
